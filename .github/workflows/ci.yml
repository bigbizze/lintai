name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Go vet
        run: go vet $(go list ./... | grep -v /internal/tsgo/internal/)

      - name: Go tests
        run: go test ./...

      - name: TypeScript compiler copy matches sync script
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/sync-tsgo.sh "$(sed -n 's/^commit: //p' internal/tsgo/VERSION)"
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Go consumer module smoke
        working-directory: testdata/consumer-module
        run: go run -mod=readonly .

      - name: Build host npm binary
        run: pnpm build:npm-binary:host

      - name: SDK tests
        run: pnpm --filter @lintai/sdk test

      - name: ESLint plugin tests
        run: pnpm --filter @lintai/eslint-plugin test

      - name: npm smoke
        run: pnpm smoke:npm
